<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Soft pastel background gradient -->
    <linearGradient id="pastelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" /> <!-- Soft Lavender -->
      <stop offset="50%" stop-color="#E0F2FE" /> <!-- Pastel Sky Blue -->
      <stop offset="100%" stop-color="#FCE7F3" /> <!-- Soft Rose/Pink -->
    </linearGradient>
    
    <!-- Card/Media node gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6" />
    </linearGradient>
    
    <!-- Drop shadow for depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#pastelBg)" />

  <!-- Central Media Hub Graphic Elements -->
  <g filter="url(#softShadow)" transform="translate(24, 24)">
    <!-- Back Card / Server Node -->
    <rect x="20" y="10" width="112" height="112" rx="20" fill="#DDD6FE" opacity="0.6" />
    
    <!-- Main Media Card -->
    <rect x="10" y="20" width="112" height="112" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Play / Media Icon Element -->
    <circle cx="66" cy="76" r="26" fill="#F472B6" opacity="0.15" />
    <polygon points="57,63 79,76 57,89" fill="#818CF8" />
    
    <!-- Decorative dots / Media status indicators -->
    <circle cx="34" cy="44" r="5" fill="#34D399" opacity="0.7" />
    <circle cx="50" cy="44" r="5" fill="#FBBF24" opacity="0.7" />
    <circle cx="66" cy="44" r="5" fill="#F87171" opacity="0.7" />
  </g>
</svg>
